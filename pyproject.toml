[project]
name = "musicdl"
version = "0.1.0"
description = "CLI wrapper around yt-dlp, scdl and spotdl to download music from YouTube, YouTube Music, SoundCloud and Spotify into a clean library."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scdl>=3.0.8",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
spotify = ["spotdl>=4.5.2"]

[project.scripts]
musicdl = "musicdl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicdl"]
